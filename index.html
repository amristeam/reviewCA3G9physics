TOPICS.push({id:'a',name:'20.1 Magnetic Effect of a Current',short:'Magnetic effect',color:'#6b5bd6',
lo:['Describe the pattern and direction of the magnetic field due to currents in straight wires and solenoids.','Describe an experiment to identify the pattern of the field (including direction) for straight wires and solenoids.','Describe how the magnetic effect of a current is used in relays and loudspeakers.','(E) State the qualitative variation of field strength around straight wires and solenoids.','(E) Describe the effect on the field of changing the magnitude and direction of the current.','Electromagnets are temporary magnets made of soft iron.'],
notes:[
{t:'1  Field around a straight wire and a solenoid',lo:[0,3],h:`<p>A <b>current in a straight wire</b> makes a magnetic field of <b>concentric circles</b> around the wire. The lines are <b>closer together near the wire</b>, where the field is stronger, and get further apart (weaker field) as you move away. <span class="E">(E)</span></p>
<div class="key box"><b>Right-hand grip rule (wire):</b> thumb = direction of <b>conventional current</b>; curled fingers = direction of the <b>magnetic field</b>.</div>
<div class="fig"><svg viewBox="0 0 520 200" width="520"><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#6b5bd6"/></marker></defs><g fill="none" stroke="#6b5bd6" stroke-width="2.5"><circle cx="110" cy="100" r="30"/><circle cx="110" cy="100" r="55"/><circle cx="110" cy="100" r="80"/></g><circle cx="110" cy="100" r="9" fill="#0b1f3a"/><circle cx="110" cy="100" r="3" fill="#fff"/><text x="60" y="195" font-size="12">current out of the page (clockwise lines for “into”)</text><path d="M110,20 L112,20" stroke="#6b5bd6" marker-end="url(#ma)"/><rect x="290" y="70" width="190" height="60" rx="30" fill="#efeaff" stroke="#6b5bd6" stroke-width="3"/><g stroke="#6b5bd6" stroke-width="2" fill="none"><path d="M300,60 C340,10 430,10 470,60" marker-end="url(#ma)"/><path d="M300,140 C340,190 430,190 470,140" marker-start="url(#ma)"/></g><text x="365" y="105" font-size="14" font-weight="700" fill="#6b5bd6">N          S</text><text x="300" y="195" font-size="12">solenoid: field like a bar magnet</text></svg></div>
<p><b>Solenoid</b> (a long coil): the field is <b>strong and almost uniform inside</b> and spreads out from the ends, like a bar magnet. Field lines leave the <b>N</b> end and return to the <b>S</b> end. Right-hand rule for a solenoid: curl the fingers of your right hand in the direction of the current; your thumb points to the <b>N pole</b>. <span class="E">(E)</span> The field is strongest close to the wire or inside the coil.</p>`},
{t:'2  Changing the current; investigating the field',lo:[1,4],h:`<p><span class="E">(E)</span> A <b>larger current</b> gives a <b>stronger field</b> (closer, denser lines). <b>Reversing the current reverses the field direction</b>. More turns on a solenoid (per unit length) also strengthen the field.</p>
<p><b>Experiment (pattern and direction):</b> pass a current through a wire that goes through a card; sprinkle <b>iron filings</b> and tap the card: they form circles (pattern). Place <b>plotting compasses</b> around the wire: the N pole of each compass points along the field, so the compasses show the <b>direction</b>. Reverse the current: the compasses all point the opposite way. For a solenoid, do the same around and inside the coil.</p>
<div class="tip box"><b>Remember:</b> iron filings show the <i>pattern</i>; a plotting compass shows the <i>direction</i> (its N pole points the way the field points).</div>`},
{t:'3  Electromagnets, relays and loudspeakers',lo:[2,5],h:`<p>An <b>electromagnet</b> is a solenoid with a <b>soft-iron core</b>. It is a <b>temporary magnet</b>: magnetised only while there is a current, so it can be switched on and off (scrapyard cranes, door locks, electric bells). Soft iron is used because it magnetises and demagnetises easily; steel would stay magnetised.</p>
<p><b>Relay:</b> a switch worked by an electromagnet. A <b>small current</b> in the coil magnetises the core, which pulls an iron armature and <b>closes contacts</b> in a second circuit that carries a <b>large current</b> (e.g. a car starter motor).</p>
<p><b>Loudspeaker:</b> a coil attached to a paper cone sits in the field of a permanent magnet. The <b>alternating current</b> in the coil gives a force that keeps changing direction, so the cone <b>vibrates</b> and makes sound.</p>
<div class="warn box"><b>Common mistakes:</b> saying a soft-iron core stays magnetised after the current stops; using the left hand for the field around a wire (the right-hand grip rule is for fields); drawing field lines that cross.</div>`}],
worked:[
{t:'Direction of the field around a wire',q:'A current flows downwards (away from you) in a vertical wire. Looking from above, which way do the field lines go?',steps:['Point the right thumb in the direction of the conventional current: down.','Curl the fingers: they curve <b>clockwise when viewed from above</b>.','So the field lines are clockwise circles. Reversing the current makes them anticlockwise.']},
{t:'How a relay works',q:'Explain how a small current in a relay coil can switch a large current in another circuit.',steps:['The small current flows through the coil and makes the <b>soft-iron core</b> an electromagnet.','The electromagnet <b>attracts the iron armature</b>, which pivots.','The armature <b>closes the contacts</b> of the second circuit, so the large current flows. When the coil current stops, a spring opens the contacts.']}],
mcq:[
{s:'0625/11/M/J/26 · Q27',t:'Which row gives the metal used to make the core of an electromagnet and one property of the electromagnet?',o:['iron — permanent magnet','iron — temporary magnet','steel — permanent magnet','steel — temporary magnet'],a:1,e:'The core is soft iron and the electromagnet is a temporary magnet (magnetic only while the current flows).',lo:[5]},
{s:'0625/11/O/N/23 · Q24',t:'Which metal could be used for a permanent magnet and which metal could be used for the core of an electromagnet?  (permanent magnet / core of electromagnet)',o:['iron / copper','iron / steel','steel / copper','steel / iron'],a:3,e:'Steel keeps its magnetism (permanent magnet); soft iron loses it (electromagnet core).',lo:[5]},
{s:'0625/12/M/J/23 · Q32',t:'In which device is the magnetic effect of a current not used?',o:['electromagnet','loudspeaker','potential divider','relay'],a:2,e:'A potential divider uses resistors only. Electromagnets, loudspeakers and relays all use the magnetic effect of a current.',lo:[2]},
{s:'0625/12/M/J/26 · Q27',t:'What is not an example of induced magnetism being used?',o:['using a compass needle to find the direction of the Earth’s magnetic field','magnetising a soft-iron bar by placing it in a strong magnetic field','using an electromagnet to pick up pieces of scrap iron','using a soft-iron core in a transformer'],a:0,e:'A compass needle is already a permanent magnet. The other three use induced magnetism in soft iron.',lo:[5]},
{s:'',t:'The magnetic field around a straight wire carrying a current is made of…',o:['straight lines parallel to the wire','concentric circles around the wire','lines pointing away from the wire','lines that cross at the wire'],a:1,e:'The field forms concentric circles around the wire.',lo:[0]},
{s:'',t:'A current flows in a vertical wire downwards (away from a student looking from above). Using the right-hand grip rule, which direction are the field lines as seen from above?',o:['clockwise','anticlockwise','radially outwards','radially inwards'],a:0,e:'Thumb down (current), fingers curl clockwise when viewed from above.',lo:[0]},
{s:'',t:'A student wants to find the DIRECTION of the magnetic field at points around a current-carrying wire. Which equipment is best?',o:['iron filings only','a plotting compass','an ammeter','a thermometer'],a:1,e:'The N pole of a plotting compass points along the field direction. Iron filings show only the pattern.',lo:[1]},
{s:'',t:'In an experiment, iron filings sprinkled on a card around a wire carrying a current form circles. What does this show?',o:['the direction of the current','the pattern of the magnetic field','the strength of the cell','the resistance of the wire'],a:1,e:'The filings line up along the field lines, showing the field’s pattern (circles).',lo:[1]},
{s:'',t:'Which statement about a relay is correct?',o:['A large current in the coil switches a small current on.','A small current in the coil switches a large current in another circuit.','It works only with a permanent magnet.','It changes the voltage of the supply.'],a:1,e:'A relay uses a small current to operate an electromagnet that closes contacts in a second circuit carrying a large current.',lo:[2]},
{s:'',t:'How does a loudspeaker produce sound?',o:['A steady current makes a coil stay still in a magnetic field.','An alternating current in a coil in a magnetic field makes the cone vibrate.','A magnet turns a cone round and round.','A transformer changes sound into current.'],a:1,e:'The alternating current in the coil gives a changing force, so the cone vibrates.',lo:[2]},
{s:'',t:'(E) How does the strength of the magnetic field around a straight wire change as you move away from the wire?',o:['It gets weaker.','It gets stronger.','It stays the same.','It is zero everywhere.'],a:0,e:'The field is strongest close to the wire; the lines spread out and the field gets weaker with distance.',lo:[3]},
{s:'',t:'(E) A solenoid is joined to a power supply. At which place is the magnetic field strongest?',o:['inside the coil','a long way from the coil','at a point above the coil, 1 m away','all places are the same'],a:0,e:'The field is strong and almost uniform inside a solenoid, and weaker outside.',lo:[3]},
{s:'',t:'(E) The current in a solenoid is doubled and its direction reversed. What happens to the magnetic field?',o:['stronger, same direction','stronger, reversed direction','weaker, reversed direction','no change'],a:1,e:'More current → stronger field; reversing the current reverses the field direction.',lo:[4]},
{s:'',t:'(E) A student reverses the current in a straight wire while plotting compasses are placed around it. What does she see?',o:['the compasses spin','the compasses all point the opposite way','the compasses point the same way','the compasses stop working'],a:1,e:'Reversing the current reverses the field direction, so each compass reverses.',lo:[4]}],
wr:[
{s:'',m:5,t:'(a) Describe an experiment to show the pattern and the direction of the magnetic field around a straight wire carrying a current. (b) State what happens when the current is reversed. (c) State one way to make the field stronger.',a:'(a) Pass the wire vertically through a horizontal card and connect it to a d.c. supply. <b>Sprinkle iron filings</b> on the card and tap it: they form <b>concentric circles</b> (pattern). Put <b>plotting compasses</b> on the card around the wire; the <b>N pole of each compass points along the field</b>, showing the direction (clockwise or anticlockwise). (b) The <b>compass needles reverse</b>: the field direction reverses. (c) <b>Increase the current</b> (or, for a solenoid, add more turns).',lo:[0,1,4]},
{s:'',m:5,t:'Explain how a relay allows a small current to switch a large current, and give one example of where a relay is used. Explain why soft iron rather than steel is used for the core.',a:'The <b>small current in the coil</b> magnetises the soft-iron core (electromagnet). The core <b>attracts an iron armature</b>, which <b>closes the contacts</b> of a second circuit with a large current. Example: <b>car starter motor, or a switch for a heater</b>. Soft iron is used because it <b>magnetises and demagnetises easily</b>, so the relay turns off when the current stops; steel would stay magnetised.',lo:[2,5]},
{s:'',m:3,t:'An electromagnet is made of a solenoid with a core. (a) State one material suitable for the core, and say whether the electromagnet is a temporary or permanent magnet. (b) Describe the effect on the magnetic field of increasing the current in the solenoid. (c) State what is meant by a temporary magnet.',a:'(a) <b>Soft iron</b>; it is a <b>temporary magnet</b>. (b) The magnetic field becomes <b>stronger</b>. (c) A temporary magnet is magnetic <b>only while the current flows</b> (it loses its magnetism when the current is switched off).',lo:[4,5]}]

TOPICS.push({id:'b',name:'20.2–20.3 Force on a Conductor and the d.c. Motor',short:'Motor effect',color:'#e5703a',
lo:['Describe an experiment showing a force on a current-carrying conductor in a magnetic field, including the effect of reversing the current and the field.','(E) Recall and use the relative directions of force, field and current.','(E) Determine the direction of the force on beams of charged particles in a magnetic field.','Know that a current-carrying coil in a field has a turning effect, increased by more turns, more current or a stronger field.','(E) Describe the operation of an electric motor, including the split-ring commutator and brushes.'],
notes:[
{t:'1  The motor effect',lo:[0],h:`<p>A wire carrying a current in a magnetic field (not parallel to it) feels a <b>force</b>: the <b>motor effect</b>. The force is at <b>right angles</b> to both the field and the current.</p>
<ul><li><b>Reversing the current</b> reverses the force.</li><li><b>Reversing the field</b> (swap the magnets) reverses the force.</li><li>Reversing <b>both</b> leaves the force unchanged.</li><li>A wire <b>parallel</b> to the field feels no force.</li></ul>
<p><b>Experiment:</b> a metal rod rests on two rails between the poles of a magnet and is connected to a cell and switch. When the switch is closed the rod rolls along the rails; it moves the other way if the cell or the magnets are reversed.</p>`},
{t:'2  Fleming’s left-hand rule (E) and charged particles (E)',lo:[1,2],h:`<div class="key box"><b>Fleming’s left-hand rule:</b> hold the left hand with First finger, seCond finger and thuMb at right angles. <b>F</b>irst finger = magnetic <b>F</b>ield (N → S); se<b>C</b>ond finger = <b>C</b>onventional current (+ → −); thu<b>M</b>b = <b>M</b>otion (force).</div>
<div class="fig"><svg viewBox="0 0 340 190" width="340"><defs><marker id="mb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#e5703a"/></marker></defs><g stroke="#e5703a" stroke-width="4" fill="none"><line x1="170" y1="110" x2="300" y2="110" marker-end="url(#mb)"/><line x1="170" y1="110" x2="170" y2="20" marker-end="url(#mb)"/><line x1="170" y1="110" x2="110" y2="165" marker-end="url(#mb)"/></g><g font-size="13" font-weight="700"><text x="250" y="132">field (First finger)</text><text x="178" y="30">force (thuMb)</text><text x="22" y="170">current (seCond finger)</text></g></svg><small>The three directions are at right angles. Use the LEFT hand for the motor effect.</small></div>
<p><b>Worked idea:</b> field N→S points right, current out of the page: first finger right, second finger out of the page, thumb up: the force is <b>upwards</b>. Reverse the current: the force is <b>downwards</b>.</p>
<p><span class="E">(E)</span> A <b>beam of charged particles</b> is a current. Use <b>conventional current</b> for the second finger: for a positive particle it points the way the particle moves; for an <b>electron it points opposite to its motion</b>. The beam is deflected sideways (at right angles to its motion and the field).</p>`},
{t:'3  The d.c. motor',lo:[3,4],h:`<p>A <b>coil</b> in a magnetic field: the forces on its two long sides are <b>opposite</b>, which gives a <b>turning effect</b> (moment). The turning effect <b>increases</b> with: more <b>turns</b> on the coil, a larger <b>current</b>, a stronger <b>magnetic field</b>.</p>
<div class="fig"><svg viewBox="0 0 440 190" width="440"><rect x="30" y="40" width="40" height="110" fill="#ffd9c7" stroke="#e5703a" stroke-width="3"/><text x="38" y="100" font-size="20" font-weight="700">N</text><rect x="370" y="40" width="40" height="110" fill="#d6e6ff" stroke="#2b6fd6" stroke-width="3"/><text x="380" y="100" font-size="20" font-weight="700">S</text><rect x="150" y="60" width="140" height="70" rx="4" fill="none" stroke="#0b1f3a" stroke-width="4"/><text x="170" y="100" font-size="13">coil</text><rect x="205" y="140" width="14" height="26" fill="#b0b8c4" stroke="#555"/><rect x="221" y="140" width="14" height="26" fill="#b0b8c4" stroke="#555"/><text x="160" y="184" font-size="12">split-ring commutator</text><rect x="182" y="150" width="18" height="10" fill="#333"/><rect x="240" y="150" width="18" height="10" fill="#333"/><text x="266" y="162" font-size="12">carbon brushes</text></svg><small>Side view of a simple d.c. motor.</small></div>
<p><span class="E">(E)</span> <b>Split-ring commutator:</b> two halves of a ring fixed to the coil. Every <b>half turn</b> it <b>reverses the connections</b>, so the <b>current in the coil reverses</b> and the forces keep pushing the coil in the <b>same direction</b>: the coil turns continuously. <b>Brushes</b> (carbon) press on the commutator to give a sliding electrical contact.</p>
<div class="warn box"><b>Common mistakes:</b> using the right hand; using electron flow for the second finger; saying the commutator reverses the <i>magnetic field</i> or that the brushes reverse the current.</div>`}],

{s:'',m:5,t:'(a) Describe an experiment to show that a force acts on a current-carrying wire in a magnetic field. (b) State what happens when (i) the current is reversed, (ii) the magnets are reversed, (iii) both are reversed. (c) State two ways to increase the force.',a:'(a) Place a <b>metal rod on two rails between the poles of a magnet</b>, connect the rails to a cell and switch. Close the switch: the <b>rod rolls along the rails</b> (the wire feels a force). (b) (i) the force/rod movement <b>reverses</b>; (ii) it <b>reverses</b>; (iii) it stays the <b>same</b>. (c) <b>Increase the current</b>; use a <b>stronger magnet</b>.',lo:[0]},

{s:'',m:3,t:'(E) A beam of electrons travels from left to right through a magnetic field that points into the page. (a) State the direction of the conventional current. (b) Use Fleming’s left-hand rule to state the direction of the force on the beam.',a:'(a) <b>To the left</b> (opposite to the electrons’ motion). (b) First finger = into the page; seCond finger = left; the thuMb points <b>down the page</b>. So the beam bends <b>downwards</b>.',lo:[1,2]}]

TOPICS.push({id:'c',name:'21.1–21.2 Induction and the a.c. Generator',short:'Induction & generator',color:'#1e8e6e',
lo:['A conductor moving across a magnetic field, or a changing field linking a conductor, can induce an e.m.f.','Describe an experiment to demonstrate electromagnetic induction.','State the factors affecting the size of an induced e.m.f.','(E) The direction of an induced e.m.f. opposes the change causing it.','(E) State and use the relative directions of force, field and induced current.','(E) Describe a simple a.c. generator and the use of slip rings and brushes.','(E) Sketch and interpret e.m.f.–time graphs for a simple a.c. generator and relate coil positions to peaks, troughs and zeros.'],
notes:[
{t:'1  Electromagnetic induction',lo:[0,1,2],h:`<p><b>Electromagnetic induction:</b> an <b>e.m.f. is induced</b> in a conductor when it <b>cuts magnetic field lines</b> (moves across a field) or when the magnetic field <b>through a coil changes</b>. If the circuit is complete, a current flows (induced current).</p>
<p><b>Experiment:</b> connect a coil to a sensitive voltmeter or galvanometer. Push a bar magnet <b>into</b> the coil: the meter deflects <b>only while the magnet moves</b>. Pull it out: the deflection is the <b>opposite way</b>. Reverse the magnet (swap poles): the deflection reverses. Hold the magnet still: <b>no reading</b>.</p>
<div class="key box"><b>Size of the induced e.m.f. increases with:</b> <b>faster</b> relative movement, a <b>stronger magnet</b> (stronger field), <b>more turns</b> on the coil. The polarity of the magnet does <i>not</i> change the size, only the direction.</div>
<div class="warn box"><b>Common mistake:</b> “a stationary magnet inside a coil induces a current”. There must be <b>relative movement</b> or a <b>changing field</b>.</div>`},
{t:'2  Direction of the induced e.m.f. (E)',lo:[3,4],h:`<p><span class="E">(E)</span> The direction of an induced e.m.f. (and current) <b>always opposes the change that causes it</b>. Push the N pole of a magnet towards a coil: the induced current makes the near end of the coil a <b>N pole</b>, which <b>repels</b> the magnet (opposes the motion). Pull it away: the near end becomes a <b>S pole</b>, which attracts it (opposes the movement away). This is conservation of energy: work must be done to move the magnet.</p>
<p>For a wire moved across a field, the induced current in the wire feels a <b>force that opposes the wire’s motion</b>. The directions of <b>force, field and current are all at right angles</b>; use the left-hand rule to check the force direction on the induced current.</p>`},
{t:'3  The simple a.c. generator',lo:[5],h:`<p>A <b>coil rotates in a magnetic field</b> (or a magnet rotates inside a coil). The coil cuts field lines, so an <b>e.m.f. is induced</b>. Because each side of the coil moves up, then down, the current <b>reverses direction every half turn</b>: <b>alternating current (a.c.)</b>.</p>
<div class="fig"><svg viewBox="0 0 470 190" width="470"><rect x="30" y="40" width="40" height="110" fill="#ffd9c7" stroke="#e5703a" stroke-width="3"/><text x="40" y="100" font-size="20" font-weight="700">N</text><rect x="400" y="40" width="40" height="110" fill="#d6e6ff" stroke="#2b6fd6" stroke-width="3"/><text x="410" y="100" font-size="20" font-weight="700">S</text><rect x="150" y="60" width="170" height="70" rx="4" fill="none" stroke="#0b1f3a" stroke-width="4"/><circle cx="205" cy="150" r="9" fill="#c0c7d3" stroke="#555"/><circle cx="265" cy="150" r="9" fill="#c0c7d3" stroke="#555"/><text x="152" y="176" font-size="12">slip rings (fixed to coil)</text><rect x="196" y="160" width="18" height="9" fill="#333"/><rect x="256" y="160" width="18" height="9" fill="#333"/><text x="290" y="168" font-size="12">brushes</text></svg><small>The slip rings rotate with the coil; stationary carbon brushes press on them.</small></div>
<p><b>Slip rings and brushes:</b> keep the rotating coil <b>connected to the external circuit</b> (no twisting wires). A d.c. motor uses a <b>split-ring commutator</b>; an a.c. generator uses <b>slip rings</b>.</p>`},
{t:'4  The e.m.f.–time graph',lo:[6],h:`<div class="fig"><svg viewBox="0 0 480 200" width="480"><g stroke="#333" stroke-width="1.5"><line x1="40" y1="100" x2="460" y2="100"/><line x1="40" y1="10" x2="40" y2="190"/></g><path d="M40,100 C80,20 120,20 160,100 C200,180 240,180 280,100 C320,20 360,20 400,100 C420,140 440,160 450,150" fill="none" stroke="#1e8e6e" stroke-width="3.5"/><g font-size="12"><text x="85" y="25" fill="#1e8e6e" font-weight="700">peak</text><text x="205" y="195" fill="#d52929" font-weight="700">trough</text><text x="150" y="92">zero</text><text x="270" y="92">zero</text><text x="44" y="16">e.m.f.</text><text x="436" y="116">time</text></g></svg><small>One complete revolution of the coil = one complete cycle of the graph.</small></div>
<ul><li><b>Zero e.m.f.:</b> coil at <b>right angles</b> to the field (not cutting lines).</li><li><b>Peak (maximum) e.m.f.:</b> coil <b>parallel</b> to the field (cutting lines fastest); the <b>trough</b> is a peak in the opposite direction.</li><li>Rotate <b>faster</b>: <b>larger peak</b> and <b>more cycles per second</b>. Stronger magnet or more turns: larger peak.</li><li>At 50 revolutions per second the output has 50 cycles per second (50 Hz).</li></ul>`}],

{s:'0625/11/M/J/21 · Q34',t:'A solenoid is connected to a very sensitive ammeter. A rod is inserted into one end of the solenoid. The ammeter shows that there is a small electric current in the solenoid while the rod is moving. Which rod is being inserted?',o:['a heated copper rod','a magnetised steel rod','an uncharged nylon rod','a radioactive uranium rod'],a:1,e:'A moving magnet changes the field through the solenoid, inducing a current. A magnetised rod is the only magnet.',lo:[0,1]},
{s:'0625/11/M/J/23 · Q31',t:'A simple electric generator induces an electromotive force (e.m.f.). Which modification would increase the induced e.m.f.?',o:['Increase the number of turns in the coil of the generator.','Increase the distance between the magnetic poles.','Reduce the strength of the magnetic field around the coil.','Reverse the direction of the magnetic field.'],a:0,e:'More turns increase the e.m.f. Weaker field or greater pole separation reduce it; reversing the field changes only the direction.',lo:[2]},

{s:'0625/12/M/J/23 · Q31',t:'A student investigates the output voltage induced across a coil of wire by a bar magnet. When will the induced voltage have the greatest value?',o:['The student slowly moves the bar magnet into the coil of wire.','The student leaves the bar magnet stationary in the coil of wire.','The student quickly removes the bar magnet from the coil of wire.','The student places the bar magnet at rest outside the coil of wire.'],a:2,e:'Quick relative movement gives the biggest e.m.f.; a stationary magnet gives none.',lo:[0,2]},
{s:'0625/12/F/M/23 · Q31',t:'A wire is moved down in a direction perpendicular to a magnetic field. Three changes are suggested. 1 The speed of the movement of the wire is increased. 2 The magnetic field strength is decreased. 3 The direction of the magnetic field is reversed. Which changes increase the electromotive force (e.m.f.) induced in the wire?',o:['1 and 3','1 only','2 and 3','3 only'],a:1,e:'Only a faster movement increases the e.m.f. A weaker field reduces it; reversing the field only changes the direction.',lo:[2]},
{s:'',t:'A bar magnet is held still inside a coil connected to a sensitive voltmeter. What does the voltmeter read?',o:['a steady maximum reading','zero','a reading that keeps increasing','a negative reading'],a:1,e:'No relative movement means no change in the field through the coil, so no e.m.f.',lo:[0,1]},
{s:'',t:'In an induction experiment the north pole of a bar magnet is pushed into a coil and the voltmeter deflects to the right. What happens when the magnet is pulled out of the coil (same pole leading)?',o:['The voltmeter deflects to the right.','The voltmeter deflects to the left.','The voltmeter stays at zero.','The voltmeter deflects to the right, and more.'],a:1,e:'Moving the magnet the opposite way reverses the direction of the induced e.m.f.',lo:[1]},
{s:'',t:'(E) The N pole of a magnet is pushed towards a coil. The end of the coil nearest the magnet becomes…',o:['a N pole, which repels the magnet','a S pole, which attracts the magnet','a N pole, which attracts the magnet','a S pole, which repels the magnet'],a:0,e:'The induced current opposes the change: the near end becomes a N pole and repels the approaching N pole.',lo:[3]},
{s:'',t:'(E) Which statement about the direction of an induced current is correct?',o:['It always helps the change that causes it.','It always opposes the change that causes it.','It is always clockwise.','It does not depend on the change.'],a:1,e:'The induced current opposes the change causing it (conservation of energy).',lo:[3]},
{s:'',t:'(E) A wire is moved across a magnetic field and an induced current flows in it. In which direction is the force on the wire due to this induced current?',o:['in the same direction as the wire’s movement','opposite to the wire’s movement','parallel to the wire','parallel to the field'],a:1,e:'The force on the induced current opposes the motion, so work must be done to move the wire.',lo:[3,4]},
{s:'',t:'(E) For a wire carrying a current in a magnetic field, which three quantities are at right angles to each other?',o:['force, field and current','speed, force and mass','field, voltage and resistance','current, charge and time'],a:0,e:'The force, the magnetic field and the current are mutually perpendicular.',lo:[4]},
{s:'',t:'(E) What do the brushes do in a simple a.c. generator?',o:['They reverse the magnetic field.','They press on the slip rings to keep a sliding contact with the external circuit.','They increase the e.m.f.','They turn the coil.'],a:1,e:'Stationary brushes touch the rotating slip rings so current can flow to the external circuit.',lo:[5]},
{s:'',t:'(E) In a simple a.c. generator the coil is rotating at constant speed. At the instant when the coil is at right angles to the magnetic field, the e.m.f. is…',o:['zero','maximum positive','maximum negative','half the maximum'],a:0,e:'At right angles to the field the coil sides move along the field and cut no lines: e.m.f. is zero.',lo:[6]},

{s:'',t:'(E) A generator coil turns 50 times every second. How many complete cycles of the e.m.f. are produced each second?',o:['1','25','50','100'],a:2,e:'One revolution produces one cycle, so 50 cycles per second (50 Hz).',lo:[6]}],
wr:[
{s:'0625/31/O/N/21 · Q10(a)',m:4,t:'A student plans to demonstrate the induction of an electromotive force (e.m.f.) in a wire. He has a length of wire, a sensitive centre-reading galvanometer and a permanent magnet. (i) Describe how the student uses the equipment. (ii) State two ways in which the student can increase the size of the induced e.m.f.',a:'(i) <b>Connect (both ends of) the wire to the galvanometer</b> [B1]; <b>move the wire relative to the magnet</b> (across the field) [B1]. (ii) Any two [B2]: <b>use a stronger magnet</b>; <b>turn the wire into a coil</b>; <b>increase the speed</b> of the relative motion.',lo:[1,2,0]},
{s:'',m:5,t:'(E) A bar magnet is pushed into a coil connected to a voltmeter, then held still, then pulled out. (a) Describe what the voltmeter shows in each of the three stages. (b) The north pole is pushed into the coil. State the polarity of the end of the coil nearest the magnet and explain why. (c) State why a stationary magnet in a coil does not induce an e.m.f.',a:'(a) <b>Pushed in:</b> the pointer deflects (e.m.f. induced) while the magnet moves; <b>held still:</b> <b>zero</b> reading; <b>pulled out:</b> deflects the <b>opposite</b> way. (b) <b>N pole</b>: the induced current opposes the change (the approaching magnet), so the coil end repels the N pole. (c) There is <b>no relative movement / no change</b> in the magnetic field through the coil, so no lines are cut.',lo:[0,1,3]},
{s:'',m:6,t:'(E) Fig. description: a simple a.c. generator has a rectangular coil rotating between the poles of a magnet. The coil is connected to a lamp through slip rings and brushes. (a) Explain the function of the slip rings and brushes. (b) Explain how an alternating current is produced in the lamp when the coil is turned. (c) State two ways to increase the maximum e.m.f.',a:'(a) The slip rings turn with the coil and the <b>brushes press on them</b>, giving a <b>continuous connection</b> between the rotating coil and the lamp without the wires twisting. (b) The coil <b>cuts the magnetic field</b> as it rotates, so an <b>e.m.f. is induced</b>; with a complete circuit there is a current whose <b>direction reverses every half turn</b>. (c) Any two: <b>turn the coil faster</b>; use <b>stronger magnets</b>; use <b>more turns</b> on the coil.',lo:[5,0,2]},
{s:'',m:4,t:'(E) Describe how the e.m.f. produced by a simple a.c. generator varies as the coil makes one complete revolution, starting with the coil at right angles to the field. State what happens to the graph if the coil turns twice as fast.',a:'Starting with the coil at right angles to the field the e.m.f. is <b>zero</b>; it rises to a <b>peak</b> when the coil is <b>parallel</b> to the field (a quarter turn), falls to <b>zero</b> at a half turn, reaches a <b>trough</b> (peak in the opposite direction) at three-quarters, and returns to <b>zero</b> after one full turn: <b>one revolution = one cycle</b>. If the coil turns twice as fast the <b>peak is larger</b> and there are <b>twice as many cycles per second</b>.',lo:[6]}]

TOPICS.push({id:'d',name:'21.3 The Transformer and Power Transmission',short:'Transformer',color:'#2b6fd6',
lo:['Describe the construction of a simple transformer with a soft-iron core.','Use the terms primary, secondary, step-up and step-down.','Recall and use Vp/Vs = Np/Ns.','Describe the use of transformers in high-voltage transmission of electricity.','State the advantages of high-voltage transmission.','(E) Explain the principle of operation of a simple iron-cored transformer.','(E) Recall and use IpVp = IsVs for a 100% efficient transformer.','(E) Recall and use P = I²R to explain why power losses in cables are smaller at higher voltage.'],
notes:[
{t:'1  Construction, terms and the turns equation',lo:[0,1,2],h:`<p>A simple <b>transformer</b> has <b>two coils of insulated copper wire</b> wound on a <b>soft-iron core</b>. The <b>primary coil</b> is the input; the <b>secondary coil</b> is the output.</p>
<div class="fig"><svg viewBox="0 0 440 190" width="440"><rect x="120" y="30" width="200" height="130" fill="none" stroke="#7a8ba8" stroke-width="22"/><text x="190" y="102" font-size="14" font-weight="700" fill="#2b6fd6">soft-iron core</text><g stroke="#e5703a" stroke-width="5" fill="none"><path d="M112,60 h30 M112,72 h30 M112,84 h30 M112,96 h30 M112,108 h30 M112,120 h30 M112,132 h30"/><path d="M298,60 h30 M298,72 h30 M298,84 h30 M298,96 h30 M298,108 h30"/></g><text x="10" y="100" font-size="13" font-weight="700">primary (Np)</text><text x="335" y="90" font-size="13" font-weight="700">secondary (Ns)</text><text x="10" y="118" font-size="12">Vp in</text><text x="360" y="108" font-size="12">Vs out</text></svg><small>Primary has more turns here, so Vs &lt; Vp: a step-down transformer.</small></div>
<div class="key box"><span class="formula">Vp / Vs = Np / Ns</span> (V in volts; N = number of turns). So <span class="formula">Vs = Vp × Ns / Np</span>.</div>
<ul><li><b>Step-up:</b> more turns on the secondary (Ns &gt; Np), so Vs &gt; Vp.</li><li><b>Step-down:</b> fewer turns on the secondary (Ns &lt; Np), so Vs &lt; Vp.</li></ul>
<p>Hook: <b>Volts follow turns.</b> A transformer needs a <b>changing (a.c.)</b> input: it does not work with d.c.</p>`},
{t:'2  How a transformer works (E) and 100% efficiency (E)',lo:[5,6],h:`<p><span class="E">(E)</span> <b>Principle:</b> an <b>alternating current in the primary</b> makes a <b>changing magnetic field</b>. The <b>soft-iron core</b> carries (concentrates) this field through the <b>secondary</b>. The changing field in the secondary <b>induces an alternating e.m.f.</b> in it.</p>
<p><span class="E">(E)</span> For a transformer that is <b>100% efficient</b>, power in = power out: <span class="formula">IpVp = IsVs</span>. If the voltage is stepped <b>up</b>, the current is stepped <b>down</b>. A step-up transformer does <b>not</b> give more power. Real transformers lose a little energy as <b>thermal energy</b> (in the coils and by eddy currents in the core).</p>`},
{t:'3  Power transmission and why high voltage',lo:[3,4,7],h:`<div class="fig"><svg viewBox="0 0 540 130" width="540"><g font-size="12" text-anchor="middle"><rect x="10" y="40" width="80" height="50" rx="8" fill="#ffe28a" stroke="#c88a00"/><text x="50" y="62">power</text><text x="50" y="77">station</text><rect x="110" y="40" width="80" height="50" rx="8" fill="#d6e6ff" stroke="#2b6fd6"/><text x="150" y="62">step-up</text><text x="150" y="77">transformer</text><line x1="190" y1="65" x2="350" y2="65" stroke="#d52929" stroke-width="4"/><text x="270" y="55" fill="#d52929" font-weight="700">high voltage, low current</text><rect x="350" y="40" width="80" height="50" rx="8" fill="#d6e6ff" stroke="#2b6fd6"/><text x="390" y="62">step-down</text><text x="390" y="77">transformer</text><rect x="450" y="40" width="80" height="50" rx="8" fill="#bde6c9" stroke="#1e8e6e"/><text x="490" y="62">homes</text><text x="490" y="77">(safe V)</text></g><line x1="90" y1="65" x2="110" y2="65" stroke="#333" stroke-width="3"/><line x1="430" y1="65" x2="450" y2="65" stroke="#333" stroke-width="3"/></svg><small>Transmission: step-up at the power station, step-down near the homes.</small></div>
<p><b>Advantages of high-voltage transmission:</b> for the same power (P = IV) a higher voltage means a <b>smaller current</b>, so <b>less energy is lost as heat in the cables</b>; <b>thinner, cheaper cables</b> can be used; fewer pylons; electricity can be sent over <b>long distances</b>.</p>
<p><span class="E">(E)</span> <b>Power lost in a cable: P = I²R.</b> It depends on the <b>square of the current</b>. Raise the voltage ×10 → current ÷10 → loss ÷100. Example: 100 kW through a cable of 2.0 Ω: at 20 kV, I = 5.0 A, loss = 5.0² × 2.0 = 50 W; at 2 kV, I = 50 A, loss = 5000 W (100 times more).</p>
<div class="warn box"><b>Common mistakes:</b> turning the ratio upside down (Vs = Vp × Ns/Np); using a transformer with d.c.; saying a step-up transformer gives more power.</div>`}],
worked:[
{t:'Turns equation',q:'A phone charger transformer has 4600 turns on the primary and 100 turns on the secondary. The primary voltage is 230 V. Find the secondary voltage and say whether it is step-up or step-down.',steps:['Vp/Vs = Np/Ns → Vs = Vp × Ns/Np.','Vs = 230 × 100 ÷ 4600 = <b>5.0 V</b>.','Ns &lt; Np (and Vs &lt; Vp), so it is a <b>step-down</b> transformer.']},
{t:'100% efficient transformer',q:'A 100% efficient transformer has Vp = 6.0 V and Vs = 24 V. The secondary current is 0.50 A. Find the primary current.',steps:['IpVp = IsVs → Ip = IsVs ÷ Vp.','Ip = 0.50 × 24 ÷ 6.0 = <b>2.0 A</b>.','Voltage ×4 (step-up), current ÷4 on the secondary side, so Ip is 4 × Is.']},
{t:'Power loss in cables',q:'A 100 kW supply is sent through a cable of resistance 2.0 Ω at (a) 20 kV, (b) 2 kV. Find the power loss in each.',steps:['I = P ÷ V. (a) I = 100 000 ÷ 20 000 = 5.0 A; loss = I²R = 5.0² × 2.0 = <b>50 W</b>.','(b) I = 100 000 ÷ 2000 = 50 A; loss = 50² × 2.0 = <b>5000 W</b>.','Ten times lower voltage → 100 times more loss.']}],
mcq:[
{s:'0625/11/M/J/21 · Q35',t:'A transformer has 460 turns on the primary coil and 24 turns on the secondary coil. The primary voltage is 230 V. What is the secondary voltage?',o:['2.0 V','12 V','48 V','4400 V'],a:1,e:'Vs = 230 × 24 ÷ 460 = 12 V.',lo:[2]},
{s:'0625/11/O/N/23 · Q33',t:'A transformer in a computer is used to transform the mains voltage of 240 V to 12 V. The number of turns on the secondary coil is 2000. Which statement about the transformer is correct?',o:['It is a step-down transformer and has 100 turns on its primary coil.','It is a step-down transformer and has 40 000 turns on its primary coil.','It is a step-up transformer and has 100 turns on its primary coil.','It is a step-up transformer and has 40 000 turns on its primary coil.'],a:1,e:'The voltage falls, so step-down. Np = 2000 × 240 ÷ 12 = 40 000 turns.',lo:[1,2]},
{s:'0625/12/F/M/24 · Q29',t:'A transformer has 200 turns on its primary coil and is connected to a 240 V a.c. supply. The output voltage of the transformer is 60 V a.c. How many turns are on the secondary coil of the transformer?',o:['20','50','72','800'],a:1,e:'Ns = 200 × 60 ÷ 240 = 50.',lo:[2]},
{s:'0625/13/M/J/24 · Q30',t:'A transformer has 400 turns on the primary coil connected to the 240 V mains supply. There are two secondary coils to serve different parts of a television. Secondary coil 1 has 2500 turns and secondary coil 2 has 20 turns. Which row is correct?  (p.d. across coil 1 / p.d. across coil 2)',o:['12 V / 3.2 V','1500 V / 12 V','4200 V / 12 V','4200 V / 33 V'],a:1,e:'V1 = 240 × 2500 ÷ 400 = 1500 V; V2 = 240 × 20 ÷ 400 = 12 V.',lo:[2]},
{s:'0625/13/M/J/23 · Q32',t:'A student makes four different types of transformer. She counts the number of turns on the primary and secondary coils and labels each as step-up or step-down. Which row shows the correct labels?  (turns on primary / turns on secondary / label)',o:['5 / 5 / step-up','10 / 5 / step-up','10 / 20 / step-down','20 / 10 / step-down'],a:3,e:'Step-down means fewer turns on the secondary (20 → 10).',lo:[1]},
{s:'0625/12/M/J/23 · Q33',t:'The diagram represents the transmission of electricity from a power station to homes that are many kilometres away. Two transformers are labelled X (at the power station) and Y (near the homes). What type of transformers are X and Y?',o:['X step-down, Y step-down','X step-down, Y step-up','X step-up, Y step-down','X step-up, Y step-up'],a:2,e:'The voltage is stepped up for transmission (X) and stepped down near homes (Y).',lo:[3]},
{s:'0625/11/O/N/21 · Q29',t:'A step-down transformer reduces mains voltage to 12 V. When the transformer is used, some energy is transferred to the surroundings. Which type of energy is transferred to the surroundings?',o:['chemical energy','light energy','thermal energy','elastic energy'],a:2,e:'Energy wasted by a transformer is mostly thermal energy.',lo:[6]},
{s:'',t:'Which statement about a step-up transformer is correct?',o:['It has fewer turns on the secondary coil than on the primary coil.','It has more turns on the secondary coil than on the primary coil.','It has the same number of turns on both coils.','It works with d.c.'],a:1,e:'Step-up: Ns > Np, so Vs > Vp.',lo:[1]},
{s:'',t:'Why does a transformer not work with a steady d.c. supply?',o:['The coils are too hot.','A steady current gives no changing magnetic field, so no e.m.f. is induced in the secondary.','d.c. has too low a voltage.','The core cannot carry d.c.'],a:1,e:'The secondary only gets an e.m.f. if the magnetic field changes.',lo:[5,0]},
{s:'',t:'A transformer has a primary coil of 1000 turns and a secondary coil of 50 turns. Which voltage across the secondary coil would be obtained from a 230 V a.c. primary supply?',o:['4.6 V','11.5 V','4600 V','11 500 V'],a:1,e:'Vs = 230 × 50 ÷ 1000 = 11.5 V.',lo:[2]},
{s:'',t:'Which is an advantage of transmitting electricity at high voltage?',o:['The current is larger.','Less energy is lost as heat in the cables.','The cables must be thicker.','The power is larger at the houses.'],a:1,e:'High voltage means a smaller current for the same power, so less heating loss.',lo:[3,4]},
{s:'',t:'Why are electricity cables over long distances usually run at very high voltage?',o:['to make the current larger','to reduce the current and so the power wasted as heat','to make the cables heavier','to charge the cables'],a:1,e:'P = IV: higher V gives a smaller I and, with P = I²R, much less loss.',lo:[4]},
{s:'',t:'(E) The primary voltage of a transformer is 20 V and the primary current is 3.0 A. Assuming 100% efficiency, what is the power output?',o:['6.7 W','23 W','60 W','600 W'],a:2,e:'Output power = input power = 20 × 3.0 = 60 W.',lo:[6]},
{s:'',t:'(E) A cable has resistance 5.0 Ω and carries a current of 10 A. What is the power lost as heat in the cable?',o:['2.0 W','50 W','500 W','5000 W'],a:2,e:'P = I²R = 10² × 5.0 = 500 W.',lo:[7]},
{s:'',t:'(E) The current in a power cable is reduced to one-tenth of its original value by raising the transmission voltage. By what factor does the power loss in the cable change?',o:['÷10','÷100','×10','×100'],a:1,e:'P = I²R: if I becomes I/10 then the loss becomes 1/100.',lo:[7]},
{s:'',t:'(E) Which part of a transformer carries the changing magnetic field from the primary to the secondary coil?',o:['the copper wire','the soft-iron core','the insulation','the steel case'],a:1,e:'The soft-iron core concentrates and carries the changing magnetic field.',lo:[5,0]}],
wr:[
{s:'0625/41/M/J/23 · Q8',m:8,t:'The electricity supplied to a town is transmitted using a high-voltage cable. A transformer in the town has a soft-iron core. (a) Explain the principle of operation of a simple iron-cored transformer. (b) The transformer steps the supply voltage down from 220 000 V to 33 000 V. (i) There are 450 turns on the secondary coil. Calculate the number of turns on the primary coil. (ii) The electrical power transferred to the transformer by the high-voltage cable is 77 MW. Calculate the current in the primary coil.',a:'(a) Any four [B4]: <b>alternating current in the primary coil</b>; this produces a <b>changing magnetic field</b>; the <b>iron core concentrates / transfers the field</b> to the secondary coil; the secondary coil is in a changing field (<b>cuts the field</b>); an <b>e.m.f. is induced</b> in the secondary coil. (b)(i) Np/Ns = Vp/Vs → Np = 450 × 220 000 ÷ 33 000 = <b>3000 turns</b> [A2]. (ii) P = IV → I = 77 × 10⁶ ÷ 220 000 = <b>350 A</b> [A3].',lo:[5,2,3]},
{s:'0625/43/M/J/23 · Q7',m:5,t:'The voltage across the primary coil of a 100% efficient transformer is 220 V and the voltage across the secondary coil is 12 V. (a) The current in the secondary coil is 2.5 A. Calculate the current in the primary coil. (b) Calculate the ratio of the number of turns on the primary coil to the number of turns on the secondary coil of the transformer.',a:'(a) IpVp = IsVs → Ip = 12 × 2.5 ÷ 220 = <b>0.14 A</b> [A3]. (b) Np/Ns = Vp/Vs = 220 ÷ 12 = <b>18 (: 1)</b> [A2].',lo:[6,2]},
{s:'0625/41/M/J/26 · Q10(c)',m:4,t:'Step-up transformers produce high-voltage electricity that is transmitted from the power station to consumers far away. (i) Explain why the power loss in the cables during electricity transmission is smaller when the transmission is at a high voltage. (ii) A transformer in the power station steps up the voltage from 25 000 V to 400 000 V. The transformer has 240 turns on the primary coil. Calculate the number of turns on the secondary coil.',a:'(i) (High voltage means) a <b>lower current</b> [B1]; and any one [B1]: P = I²R, so power loss is proportional to I²; <b>less heating effect / less thermal energy lost</b> for the same power transmitted. (ii) Ns = Np × Vs ÷ Vp = 240 × 400 000 ÷ 25 000 = 3840 ≈ <b>3800 turns</b> [A2] (the mark scheme gives 3800).',lo:[7,4,2]},
{s:'0625/43/M/J/22 · Q9(b)',m:2,t:'A step-up transformer is used to step up the output voltage of a power station from 25 000 V to 400 000 V for transmission along power lines. The number of turns on the secondary coil is 36 000. Calculate the number of turns on the primary coil.',a:'Np = Vp × Ns ÷ Vs = 25 000 × 36 000 ÷ 400 000 = 2250 ≈ <b>2300 turns</b> [A2] (mark scheme answer 2300).',lo:[2,3]},
{s:'0625/33/M/J/24 · Q9 (adapted)',m:5,t:'(a) State a suitable metal for the transformer core, for the transformer coils and for the core of an electromagnet (choose from aluminium, copper, soft iron, silver, steel). (b) The primary coil of a transformer is connected to a mains supply of 220 V a.c. The primary coil has 1500 turns and the secondary coil has 650 turns. Calculate the voltage across the secondary coil.',a:'(a) Transformer core: <b>soft iron</b>; transformer coils: <b>copper (or silver)</b>; electromagnet core: <b>soft iron</b>. (b) Vs = Vp × Ns ÷ Np = 220 × 650 ÷ 1500 = <b>95 V</b> [A3]. <i>(Adapted: the paper’s compass-needle row is left out.)</i>',lo:[0,2]},
{s:'',m:5,t:'A step-down transformer in a substation reduces 11 000 V to 230 V. (a) State how the numbers of turns on the primary and secondary coils compare. (b) The primary coil has 4800 turns. Calculate the number of turns on the secondary coil. (c) The transformer is 100% efficient and the secondary current is 40 A. Calculate the primary current.',a:'(a) The <b>primary has more turns</b> than the secondary (Np > Ns). (b) Ns = Np × Vs ÷ Vp = 4800 × 230 ÷ 11 000 = <b>100 turns</b> (100.4). (c) IpVp = IsVs → Ip = 40 × 230 ÷ 11 000 = <b>0.84 A</b>.',lo:[1,2,6]}]
});
const PSALL=[];
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "Which piece of apparatus can be used to show the direction of the magnetic field at a point near a straight wire that carries a current?", "o": ["an ammeter", "a voltmeter", "a plotting compass", "a thermometer"], "a": 2, "e": "A plotting compass needle lines up with the magnetic field, and its N pole points in the direction of the field at that point. An ammeter, a voltmeter and a thermometer do not respond to the field.", "lo": [1]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "A long straight wire carries a current out of the page, towards the reader. Which row describes the magnetic field around the wire?", "o": ["circles around the wire, clockwise", "circles around the wire, anticlockwise", "straight lines pointing away from the wire", "straight lines parallel to the wire"], "a": 1, "e": "The field around a straight wire forms concentric circles. For a current out of the page the right-hand grip rule (thumb out of the page) gives anticlockwise circles.", "lo": [0]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "A vertical wire carries a current downwards. A student looks down on the wire from directly above. What pattern and direction of magnetic field does the student see around the wire?", "o": ["concentric circles, clockwise", "concentric circles, anticlockwise", "straight lines pointing away from the wire", "straight lines pointing towards the wire"], "a": 0, "e": "The field forms circles around the wire. With the current moving away from the student (downwards), the right-hand grip rule gives a clockwise direction when seen from above.", "lo": [0]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "A vertical wire passes through a hole in the middle of a horizontal card. A plotting compass is placed on the card to the right of the wire. The compass is shielded from the Earth's magnetic field. The current in the wire then flows upwards, towards a student looking down on the card. In which direction does the N pole of the compass point?", "o": ["towards the wire", "away from the wire", "towards the bottom of the card", "towards the top of the card"], "a": 3, "e": "Seen from above, a current coming up towards the viewer gives anticlockwise circular field lines. At the point to the right of the wire an anticlockwise circle points towards the top of the card, so the compass N pole points towards the top.", "lo": [0, 1]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "A solenoid is connected to a d.c. supply. Looking at the left-hand end of the solenoid, the current flows clockwise round the coil. A small plotting compass is placed just outside the left-hand end of the solenoid, in a region shielded from the Earth's magnetic field. In which direction does the N pole of the compass point?", "o": ["to the left, away from the solenoid", "to the right, towards the solenoid", "towards the top of the page", "towards the bottom of the page"], "a": 1, "e": "A clockwise current seen from one end makes that end a south pole (anticlockwise makes a north pole). The N pole of the compass is attracted to the S pole, so it points to the right, towards the solenoid.", "lo": [0]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "(E) The current in a long straight wire is 4.0 A to the left. It is changed to 2.0 A to the right. What happens to the magnetic field around the wire?", "o": ["It becomes weaker and reversed in direction.", "It becomes weaker and stays in the same direction.", "It becomes stronger and reversed in direction.", "It becomes stronger and stays in the same direction."], "a": 0, "e": "A smaller current gives a weaker field, and reversing the current reverses the direction of the field.", "lo": [4]}});
PSALL.push({tid:'a',kind:'mcq',q:{"s": "PS", "t": "Which statements about an electromagnet used on a scrapyard crane to lift scrap iron are correct? 1 The core is soft iron, so it loses its magnetism when the current is switched off. 2 Increasing the current in the coil makes the electromagnet stronger. 3 The electromagnet stays magnetised after the current is switched off.", "o": ["1, 2 and 3", "1 and 3 only", "1 and 2 only", "2 and 3 only"], "a": 2, "e": "Statements 1 and 2 are correct. The electromagnet is only magnetised while there is a current (it is a temporary magnet), so statement 3 is wrong; this allows the scrap iron to be released.", "lo": [5]}});
PSALL.push({tid:'b',kind:'mcq',q:{"s": "PS", "t": "A student wants to increase the turning effect on the coil of a d.c. motor. Which row gives two changes that would both increase the turning effect?", "o": ["a weaker magnet and a larger current", "a stronger magnet and fewer turns on the coil", "a smaller current and more turns on the coil", "a stronger magnet and a larger current"], "a": 3, "e": "The turning effect increases when the magnetic field is stronger, the current is larger or the coil has more turns. Only the last row makes two changes that both increase it.", "lo": [3]}});
PSALL.push({tid:'b',kind:'mcq',q:{"s": "PS", "t": "In a simple d.c. motor, which single change would make the turning effect on the coil smaller?", "o": ["reducing the current in the coil", "adding more turns to the coil", "using stronger magnets", "moving the magnets closer to the coil"], "a": 0, "e": "A smaller current reduces the force on the coil and so reduces the turning effect. More turns, stronger magnets and a stronger field near the coil all increase it.", "lo": [3]}});
PSALL.push({tid:'b',kind:'mcq',q:{"s": "PS", "t": "(E) Which part of a simple d.c. motor reverses the current in the coil every half turn so that the coil keeps turning in the same direction?", "o": ["the brushes", "the split-ring commutator", "the permanent magnets", "the axle"], "a": 1, "e": "The split-ring commutator swaps the connections between the coil and the supply every half turn, which reverses the current in the coil and keeps the turning effect in one direction. The brushes only make the contact.", "lo": [4]}});
PSALL.push({tid:'c',kind:'mcq',q:{"s": "PS", "t": "A straight wire is connected to a sensitive voltmeter. In which situation is an e.m.f. induced in the wire?", "o": ["the wire rests in a uniform magnetic field", "the wire is cooled in a refrigerator", "the wire is moved across a magnetic field", "the wire is joined to a battery"], "a": 2, "e": "An e.m.f. is induced when a conductor cuts across magnetic field lines. A wire at rest in a steady field, a cooled wire and a wire joined to a battery do not cut field lines.", "lo": [0]}});
PSALL.push({tid:'c',kind:'mcq',q:{"s": "PS", "t": "A bar magnet is pushed into a coil connected to a sensitive voltmeter. Which row gives the largest reading on the voltmeter?", "o": ["slow movement, 100 turns", "slow movement, 500 turns", "fast movement, 100 turns", "fast movement, 500 turns"], "a": 3, "e": "The induced e.m.f. increases with faster relative movement and with more turns on the coil, so fast movement and 500 turns give the largest reading.", "lo": [2]}});
PSALL.push({tid:'c',kind:'mcq',q:{"s": "PS", "t": "A coil rotates between the poles of a magnet to induce an e.m.f. Which changes, on their own, will increase the e.m.f. induced in the coil? 1 rotating the coil faster 2 using a stronger magnet 3 using fewer turns of wire on the coil", "o": ["1 only", "1 and 2 only", "2 and 3 only", "1, 2 and 3"], "a": 1, "e": "The e.m.f. increases if the coil rotates faster and if the magnet is stronger. Fewer turns would reduce the e.m.f., so change 3 is wrong.", "lo": [2]}});
PSALL.push({tid:'c',kind:'mcq',q:{"s": "PS", "t": "(E) Which pair of parts allows the rotating coil of an a.c. generator to stay connected to the external circuit?", "o": ["slip rings and brushes", "split-ring commutator and brushes", "soft-iron core and slip rings", "permanent magnets and brushes"], "a": 0, "e": "Slip rings fixed to the coil, touching stationary brushes, keep a continuous connection with the external circuit while the coil rotates. A split-ring commutator belongs in a d.c. motor.", "lo": [5]}});
PSALL.push({tid:'d',kind:'mcq',q:{"s": "PS", "t": "Which device is used at a power station to increase the voltage of an a.c. supply from 25 kV to 400 kV?", "o": ["an electric motor", "a relay", "a generator", "a transformer"], "a": 3, "e": "A step-up transformer increases an alternating voltage. A motor, a relay and a generator do not change the size of an a.c. voltage.", "lo": [3]}});
PSALL.push({tid:'d',kind:'mcq',q:{"s": "PS", "t": "A student builds a transformer for a school experiment. Which design will work most efficiently?", "o": ["a copper core and two iron coils", "an iron core and one coil only", "a soft-iron core and two coils of insulated copper wire", "a steel core and two coils of insulated copper wire"], "a": 2, "e": "An efficient transformer has two coils of insulated copper wire on a soft-iron core. Soft iron is easily magnetised and demagnetised, unlike steel.", "lo": [0]}});
PSALL.push({tid:'d',kind:'mcq',q:{"s": "PS", "t": "A transformer in a phone charger changes 230 V a.c. to 5.0 V a.c. The primary coil has 4600 turns. Which type of transformer is it and how many turns does it have on the secondary coil?", "o": ["step-down, 100 turns", "step-down, 211 600 turns", "step-up, 100 turns", "step-up, 211 600 turns"], "a": 0, "e": "The voltage falls from 230 V to 5.0 V, so it is a step-down transformer. Ns = Np × Vs / Vp = 4600 × 5.0 / 230 = 100 turns.", "lo": [1, 2]}});

function pdfSan(s){
  const M={'–':'\x96','—':'\x97','’':'\x92','‘':'\x91','“':'\x93','”':'\x94','…':'\x85','•':'\x95'};
  const R={'−':'-','π':'pi','√':'sqrt','Δ':'Delta','⁻':'-','⁰':'0','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','₄':'4','≥':'>=','≤':'<=','∝':'~','⁺':'+','ω':'w','→':'->','≈':'~','₂':'2','₀':'0','₁':'1','₃':'3','☐':'[ ]','✓':'(ok)','✅':'','❌':'',' ':' '};
  let o='';
  for(const ch of String(s)){
    if(M[ch]){o+=M[ch];continue}
    if(R[ch]!==undefined){o+=R[ch];continue}
    const c=ch.charCodeAt(0);
    if(c<32){o+=(c===10?' ':'');continue}
    if(c<127||(c>=160&&c<=255)){o+=ch;continue}
    o+='?';
  }
  return o;
}

function wrapTxt(s,size,bold,maxw){
  const cw=size*(bold?0.60:0.54),mx=Math.max(10,Math.floor(maxw/cw));
  const words=pdfSan(s).split(/\s+/).filter(Boolean),lines=[];let cur='';
  for(let w of words){
    while(w.length>mx){ if(cur){lines.push(cur);cur=''} lines.push(w.slice(0,mx));w=w.slice(mx) }
    if((cur+' '+w).trim().length>mx){lines.push(cur);cur=w}else cur=(cur+' '+w).trim();
  }
  if(cur)lines.push(cur);return lines.length?lines:[''];
}

  <p style="color:var(--grey);font-size:12px;text-align:center"><a href="#" data-reset="1">Clear my saved answers on this device</a></p>`}
function mixedHTML(){
  return `<h2>Mixed test: the CA3 practice set (${MIXED.length} multiple-choice + ${MIXEDW.length} structured)</h2><p style="color:var(--grey)">This is the school's CA3 practice set, exactly as issued, covering all four topics. The topic tabs have different questions and examples. One attempt for each multiple-choice question; type an answer to unlock each model answer.</p><div id="sc-x" class="score"></div>`+MIXED.map((q,i)=>mcqHTML(q,'x'+i,i+1)).join('')+`<h3 class="sec" style="--c:#0b6b62">✍️ Section 2: structured questions from the practice set</h3>`+MIXEDW.map((q,i)=>wrHTML(q,'xw'+i,i+1)).join('')}
function ragHTML(){
  return `<h2>My RAG check and results</h2><div class="card" style="border-left:6px solid #c2358a"><b>📄 Download my results (colour PDF)</b><p style="margin:6px 0">Type your name and class, then download a PDF of your quiz results, written answers and confidence bars. You can share it with your teacher.</p><input id="stname" placeholder="Full name" style="padding:8px;border:2px solid #d5deec;border-radius:8px;width:260px;max-width:100%"> <input id="stclass" placeholder="Class (e.g. 10A)" style="padding:8px;border:2px solid #d5deec;border-radius:8px;width:150px"><br><button class="btn" id="dlbtn" disabled>⬇️ Download my results PDF</button> <small id="dlmsg" style="color:var(--grey)"></small><div id="dllink"></div></div><p style="color:var(--grey)">Your confidence ratings from each topic tab, plus your quiz results. Use this to decide what to revise first.</p><div id="ragsum"></div>`}
function ragSummary(){
  let h='',all=[],rated=0;
  TOPICS.forEach(T=>{let sum=0,n=0;T.lo.forEach((l,i)=>{const v=S.r['r-'+T.id+i];if(v!==undefined){sum+=v;n++;rated++;all.push([v,T,i])}});
    const avg=n?Math.round(sum/n):null;
    let ca=0,cn=0;T.mcq.forEach((q,i)=>{const a=S.a[T.id+'q'+i];if(a!==undefined){cn++;if(a===q.a)ca++}});
    h+=`<div class="card"><b style="color:${T.color}">${T.name}</b> · rated ${n}/${T.lo.length} objectives · quiz ${cn?ca+'/'+cn+' correct':'not started'}<div class="bar" style="margin-top:6px"><i style="width:${avg||0}%;background:${avg===null?'#ccc':rcol(avg)}"></i></div><small>${avg===null?'No ratings yet':'Average confidence '+avg+'%'}</small></div>`});
  const total=TOPICS.reduce((a,T)=>a+T.lo.length,0);
  all.sort((a,b)=>a[0]-b[0]);
  h+=`<h3>Revise these first</h3>`;
  if(!all.length)h+='<p>Rate your confidence in the topic tabs to see your weakest objectives here.</p>';
  else h+=all.slice(0,8).map(([v,T,i])=>`<div class="rag"><span class="t"><span class="pill" style="background:${T.color}">${T.name}</span>${esc(T.lo[i])}</span><b style="color:${rcol(v)}">${v}%</b></div>`).join('')+`<p style="color:var(--grey)">Rated ${rated} of ${total} objectives.</p>`;
  document.getElementById('ragsum').innerHTML=h}
function scoreUpdate(){
  const f=(pre,arr,el)=>{let a=0,c=0;arr.forEach((q,i)=>{const v=S.a[pre+i];if(v!==undefined){a++;if(v===q.a)c++}});const e=document.getElementById(el);if(e)e.innerHTML=`Multiple choice: ${a}/${arr.length} answered · ${c} correct`+(a===arr.length?` (${Math.round(c/arr.length*100)}%)`:'')};
  TOPICS.forEach(T=>f(T.id+'q',T.mcq,'sc-'+T.id));f('x',MIXED,'sc-x')}
function build(){
  const nav=document.getElementById('nav');nav.innerHTML=TABNAMES.map((n,i)=>{const T=TOPICS[i-1];const ic=i===0?'🏠':T?ICON[T.id]:(i===MIXI?'🎯':'🌈');return `<button data-go="${i}" ${T?`style="--bc:${T.color}"`:''}>${ic} ${n}</button>`}).join('');
  const m=document.getElementById('main');
  m.innerHTML=[`<section class="tab">${startHTML()}</section>`,...TOPICS.map(T=>`<section class="tab">${topicHTML(T)}</section>`),`<section class="tab">${mixedHTML()}</section>`,`<section class="tab">${ragHTML()}</section>`].join('');initSims();
  show(S.tab||0,true)}
function show(i,keep){S.tab=i;save();document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));document.querySelectorAll('#nav button').forEach((b,k)=>{b.classList.toggle('on',k===i);const T=TOPICS[k-1];b.style.background=k===i?(T?T.color:'#0b1f3a'):'';});scoreUpdate();if(i===RAGI){ragSummary();dlSetup()}if(!keep)window.scrollTo(0,0)}
const allQ={};TOPICS.forEach(T=>{T.mcq.forEach((q,i)=>allQ[T.id+'q'+i]=q);T.wr.forEach((q,i)=>allQ[T.id+'w'+i]=q)});MIXED.forEach((q,i)=>allQ['x'+i]=q);MIXEDW.forEach((q,i)=>allQ['xw'+i]=q);
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.go!==undefined){e.preventDefault();show(+b.dataset.go)}
  else if(b.dataset.i!==undefined&&b.classList.contains('opt')){const id=b.dataset.id;if(S.a[id]!==undefined)return;S.a[id]=+b.dataset.i;save();const q=allQ[id];const box=document.getElementById(id);box.querySelectorAll('.opt').forEach((o,k)=>{o.disabled=true;if(k===q.a)o.classList.add('right');else if(k===S.a[id])o.classList.add('wrong')});const fb=box.querySelector('.fb');fb.innerHTML=fbText(q,id);fb.style.display='block';scoreUpdate()}
  else if(b.dataset.sub){const id=b.dataset.sub,box=document.getElementById(id),ta=box.querySelector('textarea');if(ta.value.trim().length<12)return;S.t[id]=ta.value;S.d[id]=1;save();ta.disabled=true;b.style.display='none';box.querySelector('.model').style.display='block'}
  else if(b.dataset.next){const id=b.dataset.next,n=+b.dataset.n;S.w[id]=Math.min((S.w[id]||0)+1,n);save();document.querySelectorAll(`[data-ws^="${id}-"]`).forEach((s,k)=>s.classList.toggle('show',k<S.w[id]));if(S.w[id]>=n)b.style.display='none'}
  else if(b.dataset.reset){e.preventDefault();if(confirm('Clear all saved answers and ratings on this device?')){S={a:{},t:{},d:{},r:{},w:{},tab:0};save();build()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.tagName==='TEXTAREA'&&t.dataset.id){S.t[t.dataset.id]=t.value;save();const btn=t.parentElement.querySelector('[data-sub]');if(btn)btn.disabled=t.value.trim().length<12}
  else if(t.dataset.rag){const v=+t.value;S.r[t.dataset.rag]=v;save();const o=document.getElementById(t.dataset.rag+'-v');o.textContent=v+'%';o.style.color=rcol(v)}
});
build();
</script></body></html>
